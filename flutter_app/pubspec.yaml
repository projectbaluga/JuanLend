name: microlend
description: "MicroLend — Micro-lending management suite for solo operators"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.2
  fl_chart: ^0.70.2
  intl: ^0.20.2
  provider: ^6.1.2
  path_provider: ^2.1.6
  file_picker: ^12.1.2
  share_plus: ^13.3.0
  crypto: ^3.0.6
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#18181B"
    theme_color: "#18181B"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_size: 256

flutter_native_splash:
  color: "#18181B"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#18181B"
    image: "assets/branding/splash_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
