# MicroLend Flutter App CI/CD Workflow
#
# AUTOMATIC VERSIONING & RELEASE STRATEGY:
# - Build Number: Automatically set to ${{ github.run_number }} (auto-incrementing per run).
# - Version Name Precedence:
#     1. Git Tag (e.g., v1.2.3 -> "1.2.3") when triggered by pushing a tag matching `v*.*.*`.
#     2. Manual input parameter `version_name` when triggered via `workflow_dispatch`.
#     3. Fallback: Base version parsed from `flutter_app/pubspec.yaml` (e.g., "1.0.0").
#
# RELEASES:
# On tag pushes (e.g. `v1.2.3`), a GitHub Release is automatically published attaching
# Android APK, App Bundle (AAB), and zipped Windows Desktop binaries.
#
# BRANDING OVERRIDES & TRIGGER SCOPE:
# - Manual inputs (`app_name`, `app_description`, `brand_color`, `icon_url`) are set when manually running
#   the workflow via `workflow_dispatch` ("Run workflow").
# - For automated triggers (e.g. tag or push events), default branding is fallback unless Repository Variables
#   (vars.APP_NAME, vars.APP_DESCRIPTION, vars.BRAND_COLOR, vars.ICON_URL) are set in GitHub Settings.
#
# SIGNING & RELEASE DISTRIBUTION NOTES:
# 1. Android Release Signing:
#    - To produce signed APK/AAB builds for Google Play or distribution, create an Android keystore
#      and store base64-encoded keystore, alias, password, and key password in GitHub Repository Secrets
#      (e.g., ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
#    - Decode the keystore in CI before running `flutter build apk / appbundle`.
#
# 2. iOS Release Signing & App Store Distribution:
#    - To produce signed iOS builds, add Apple Developer certificates and provisioning profiles
#      via Apple App Store Connect API keys or fastlane match.
#    - Pass `--codesign` and specify the target profile / certificate secrets in GitHub Secrets.
#
# 3. Windows Desktop Executable Release:
#    - Note: No code signing (Authenticode) is configured for Windows executable builds.
#    - To sign the Windows installer/EXE, add a PFX certificate to Repository Secrets and use `signtool.exe` in CI.

name: Flutter Build & Test

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name override (e.g. 1.2.3). Leave blank to use tag or pubspec default.'
        required: false
        default: ''
      app_name:
        description: 'App Name override (e.g. MicroLend Pro)'
        required: false
        default: ''
      app_description:
        description: 'App Description override'
        required: false
        default: ''
      brand_color:
        description: 'Brand Theme Color Hex (e.g. #18181B)'
        required: false
        default: ''
      icon_url:
        description: 'URL to custom 1024x1024 PNG app icon'
        required: false
        default: ''

defaults:
  run:
    working-directory: flutter_app

jobs:
  version:
    name: Compute Version Metadata
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.compute.outputs.version_name }}
      build_number: ${{ steps.compute.outputs.build_number }}
      app_slug: ${{ steps.compute.outputs.app_slug }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Version Name, Build Number, and App Slug
        id: compute
        run: |
          # 1. Parse base version from pubspec.yaml (part before '+')
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)

          # 2. Determine version_name precedence: Tag > Manual Input > Pubspec Fallback
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION_NAME="${TAG_NAME#v}"
          elif [ -n "${{ inputs.version_name }}" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          elif [ -n "$PUBSPEC_VERSION" ]; then
            VERSION_NAME="$PUBSPEC_VERSION"
          else
            echo "Error: Unable to determine version_name."
            exit 1
          fi

          # Sanitize version_name: trim whitespace and strip leading 'v' or 'version' (case-insensitive)
          VERSION_NAME=$(echo "$VERSION_NAME" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
          VERSION_NAME=$(echo "$VERSION_NAME" | sed -E 's/^(v|version)[[:space:]]*//i')
          VERSION_NAME=$(echo "$VERSION_NAME" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')

          # Validate version_name matches semver format (e.g., 1.8, 1.2.3)
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Error: Invalid version_name format '$VERSION_NAME'. Expected format like '1.8' or '1.2.3'."
            exit 1
          fi

          # 3. Compute deterministic build_number from x.y.z version_name or fallback
          if [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            BUILD_NUMBER="${{ github.run_number }}"
          fi

          # 4. Compute app_slug for artifact names
          RAW_APP_NAME="${{ inputs.app_name || vars.APP_NAME }}"
          if [ -z "$RAW_APP_NAME" ]; then
            RAW_APP_NAME="microlend"
          fi
          APP_SLUG=$(echo "$RAW_APP_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$APP_SLUG" ]; then
            APP_SLUG="microlend"
          fi

          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "app_slug=$APP_SLUG" >> "$GITHUB_OUTPUT"
          echo "Computed Version Name: $VERSION_NAME"
          echo "Computed Build Number: $BUILD_NUMBER"
          echo "Computed App Slug: $APP_SLUG"

  android-build:
    name: Build Android (APK & AAB)
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Branding Overrides
        shell: bash
        env:
          ICON_URL: ${{ inputs.icon_url || vars.ICON_URL }}
          APP_NAME: ${{ inputs.app_name || vars.APP_NAME }}
          APP_DESCRIPTION: ${{ inputs.app_description || vars.APP_DESCRIPTION }}
          BRAND_COLOR: ${{ inputs.brand_color || vars.BRAND_COLOR }}
          BUILD_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: bash tool/apply_branding.sh

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build Android APK (Release)
        run: flutter build apk --release --dart-define=APP_NAME="${{ inputs.app_name || vars.APP_NAME }}" --dart-define=APP_DESCRIPTION="${{ inputs.app_description || vars.APP_DESCRIPTION }}" --dart-define=APP_VERSION="${{ needs.version.outputs.version_name }}" --dart-define=APP_BUILD="${{ needs.version.outputs.build_number }}" --build-name="${{ needs.version.outputs.version_name }}" --build-number="${{ needs.version.outputs.build_number }}"

      - name: Build Android App Bundle (AAB Release)
        run: flutter build appbundle --release --dart-define=APP_NAME="${{ inputs.app_name || vars.APP_NAME }}" --dart-define=APP_DESCRIPTION="${{ inputs.app_description || vars.APP_DESCRIPTION }}" --dart-define=APP_VERSION="${{ needs.version.outputs.version_name }}" --dart-define=APP_BUILD="${{ needs.version.outputs.build_number }}" --build-name="${{ needs.version.outputs.version_name }}" --build-number="${{ needs.version.outputs.build_number }}"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.app_slug }}-android-apk-${{ needs.version.outputs.version_name }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.app_slug }}-android-aab-${{ needs.version.outputs.version_name }}
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab

  ios-build:
    name: Build iOS (Unsigned)
    needs: version
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Branding Overrides
        shell: bash
        env:
          ICON_URL: ${{ inputs.icon_url || vars.ICON_URL }}
          APP_NAME: ${{ inputs.app_name || vars.APP_NAME }}
          APP_DESCRIPTION: ${{ inputs.app_description || vars.APP_DESCRIPTION }}
          BRAND_COLOR: ${{ inputs.brand_color || vars.BRAND_COLOR }}
          BUILD_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: bash tool/apply_branding.sh

      - name: Build iOS App (Release, Unsigned)
        run: flutter build ios --release --no-codesign --dart-define=APP_NAME="${{ inputs.app_name || vars.APP_NAME }}" --dart-define=APP_DESCRIPTION="${{ inputs.app_description || vars.APP_DESCRIPTION }}" --dart-define=APP_VERSION="${{ needs.version.outputs.version_name }}" --dart-define=APP_BUILD="${{ needs.version.outputs.build_number }}" --build-name="${{ needs.version.outputs.version_name }}" --build-number="${{ needs.version.outputs.build_number }}"

      - name: Upload Unsigned iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.app_slug }}-ios-unsigned-${{ needs.version.outputs.version_name }}
          path: flutter_app/build/ios/iphoneos

  macos-build:
    name: Build macOS Desktop (Release)
    needs: version
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Branding Overrides
        shell: bash
        env:
          ICON_URL: ${{ inputs.icon_url || vars.ICON_URL }}
          APP_NAME: ${{ inputs.app_name || vars.APP_NAME }}
          APP_DESCRIPTION: ${{ inputs.app_description || vars.APP_DESCRIPTION }}
          BRAND_COLOR: ${{ inputs.brand_color || vars.BRAND_COLOR }}
          BUILD_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: bash tool/apply_branding.sh

      - name: Build macOS App (Release)
        run: flutter build macos --release --dart-define=APP_NAME="${{ inputs.app_name || vars.APP_NAME }}" --dart-define=APP_DESCRIPTION="${{ inputs.app_description || vars.APP_DESCRIPTION }}" --dart-define=APP_VERSION="${{ needs.version.outputs.version_name }}" --dart-define=APP_BUILD="${{ needs.version.outputs.build_number }}" --build-name="${{ needs.version.outputs.version_name }}" --build-number="${{ needs.version.outputs.build_number }}"

      - name: Upload macOS Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.app_slug }}-macos-${{ needs.version.outputs.version_name }}
          path: flutter_app/build/macos/Build/Products/Release/

  windows-build:
    name: Build Windows Desktop (Release)
    needs: version
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Branding Overrides
        shell: bash
        env:
          ICON_URL: ${{ inputs.icon_url || vars.ICON_URL }}
          APP_NAME: ${{ inputs.app_name || vars.APP_NAME }}
          APP_DESCRIPTION: ${{ inputs.app_description || vars.APP_DESCRIPTION }}
          BRAND_COLOR: ${{ inputs.brand_color || vars.BRAND_COLOR }}
          BUILD_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: bash tool/apply_branding.sh

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build Windows Executable (Release)
        run: flutter build windows --release --dart-define=APP_NAME="${{ inputs.app_name || vars.APP_NAME }}" --dart-define=APP_DESCRIPTION="${{ inputs.app_description || vars.APP_DESCRIPTION }}" --dart-define=APP_VERSION="${{ needs.version.outputs.version_name }}" --dart-define=APP_BUILD="${{ needs.version.outputs.build_number }}" --build-name="${{ needs.version.outputs.version_name }}" --build-number="${{ needs.version.outputs.build_number }}"

      - name: Compile Windows Installer (Inno Setup)
        shell: powershell
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exeFile = Get-ChildItem -Path $releaseDir -Filter "*.exe" | Select-Object -First 1
          if (-not $exeFile) {
            Write-Error "No executable found in $releaseDir"
            exit 1
          }
          $exeName = $exeFile.Name
          Write-Host "Detected Windows executable: $exeName"
          $appName = "${{ inputs.app_name || vars.APP_NAME }}"
          if ([string]::IsNullOrWhitespace($appName)) { $appName = "MicroLend" }
          $versionName = "${{ needs.version.outputs.version_name }}"
          $appSlug = "${{ needs.version.outputs.app_slug }}"

          iscc /DMyAppName="$appName" /DMyAppVersion="$versionName" /DAppSlug="$appSlug" /DExeName="$exeName" windows/installer/microlend.iss

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.version.outputs.app_slug }}-windows-installer-${{ needs.version.outputs.version_name }}
          path: flutter_app/build/windows/installer/

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [version, android-build, ios-build, macos-build, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.version.outputs.app_slug }}-android-apk-${{ needs.version.outputs.version_name }}
          path: ./artifacts/apk

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.version.outputs.app_slug }}-android-aab-${{ needs.version.outputs.version_name }}
          path: ./artifacts/aab

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.version.outputs.app_slug }}-macos-${{ needs.version.outputs.version_name }}
          path: ./artifacts/macos

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.version.outputs.app_slug }}-windows-installer-${{ needs.version.outputs.version_name }}
          path: ./artifacts/windows

      - name: Zip macOS Build
        run: |
          cd artifacts/macos
          zip -r ../../${{ needs.version.outputs.app_slug }}-macos-${{ needs.version.outputs.version_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/apk/app-release.apk
            ./artifacts/aab/app-release.aab
            ./${{ needs.version.outputs.app_slug }}-macos-${{ needs.version.outputs.version_name }}.zip
            ./artifacts/windows/${{ needs.version.outputs.app_slug }}-windows-setup-${{ needs.version.outputs.version_name }}.exe
          name: MicroLend Release v${{ needs.version.outputs.version_name }}
          draft: false
          prerelease: false
