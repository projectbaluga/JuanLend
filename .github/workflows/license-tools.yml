# GitHub Actions Workflow for Generating Machine License Keys
name: Generate License Key

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: 'Machine ID / Device Fingerprint from app Settings -> Unlock section'
        required: true
        type: string

defaults:
  run:
    working-directory: flutter_app

jobs:
  generate-license:
    name: Generate Machine License Key
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Machine License Key
        env:
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
          MACHINE_ID_INPUT: ${{ inputs.machine_id }}
        run: |
          if [ -z "$LICENSE_PRIVATE_KEY" ]; then
            echo "Error: LICENSE_PRIVATE_KEY repository secret is not set in GitHub Settings."
            exit 1
          fi
          if [ -z "$MACHINE_ID_INPUT" ]; then
            echo "Error: machine_id input parameter is required."
            exit 1
          fi
          dart run tool/generate_license.dart --machine-id "$MACHINE_ID_INPUT" --private-key "$LICENSE_PRIVATE_KEY" | tee tool_output.txt

      - name: Upload License Key Artifact
        uses: actions/upload-artifact@v4
        with:
          name: license-key-output
          path: flutter_app/tool_output.txt
